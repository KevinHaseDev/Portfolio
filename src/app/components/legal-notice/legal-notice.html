<main class="wrapper">
  <section class="legal_notice content-shell section-space" aria-labelledby="legal_notice_heading">
    <h1 id="legal_notice_heading">{{ content().pageTitle }}</h1>

    <article class="legal_copy">
      <section class="legal_block">
        <h2>{{ content().imprintTitle }}</h2>
        <ul>
          <li>Kevin Hase</li>
          <li>Untere Kaplaneistraße 3</li>
          <li>98617 Meiningen</li>
          <li>{{ content().locationText }}</li>
          <li>{{ content().emailLabel }}: <a href="mailto:kevin@kevin-hase.de">kevin@kevin-hase.de</a></li>
        </ul>
      </section>

      <section class="legal_block">
        <p>
          {{ content().inquiryText }} <a href="mailto:kevin@kevin-hase.de">kevin@kevin-hase.de</a>.
        </p>
        <p class="legal_date">{{ content().dateLabel }}</p>
      </section>
    </article>
  </section>
</main>
